<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Counter ★ switch構文</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    color: #222;
    background: linear-gradient(160deg, #f8f8ff 0%, #e3ecff 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 24px;
  }
  h1 { margin: 0 0 12px; font-size: 32px; }
  .lead { margin: 0 0 32px; text-align: center; line-height: 1.8; color: #555; }
  .card {
    width: 100%;
    max-width: 525px;
    background: #fff;
    border-radius: 28px;
    padding: 36px;
    box-shadow: 0 20px 50px rgba(60, 80, 160, 0.18);
  }
  .count-row { text-align: center; color: #555; margin-bottom: 20px; }
  .count-row #count {
    display: inline-block;
    margin: 0 8px 0 14px;
    font-size: 40px;
    font-weight: bold;
    color: #2563eb;
    vertical-align: middle;
  }
  button {
    width: 100%;
    padding: 16px;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(90deg, #2563eb, #4f46e5);
    box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
    transition: transform 0.1s, opacity 0.2s;
  }
  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.98); }
  .label { margin: 24px 0 8px; font-weight: bold; color: #555; }
  #result {
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
    font-size: 20px;
    background: #f8f9fb;
    border: 1px solid #e2e5ea;
    border-radius: 16px;
    word-break: break-all;
  }
  footer { margin-top: 28px; font-size: 13px; color: #777; }
</style>
</head>
<body>
  <h1>Click Counter ★ switch構文</h1>
  <p class="lead">
    ボタンをクリックすると、クリック回数に応じて結果が変わります。<br>
    JavaScript の switch 構文を使って処理を作ってみましょう。
  </p>

  <div class="card">
    <div class="count-row">クリック回数<span id="count">0</span>回</div>
    <button id="btn" type="button">クリック</button>
    <div class="label">結果</div>
    <div id="result">ここに結果が表示されます</div>
  </div>

  <footer>© JavaScript Practice – switch構文 &amp; クリックイベント</footer>

<script>
  let count = 0;
  const countEl = document.getElementById("count");
  const resultEl = document.getElementById("result");

  document.getElementById("btn").addEventListener("click", function () {
    count++;
    let output = "";

    switch (count) {
      case 1:
        // 1回目：★を1個
        output = "★";
        break;
      case 2:
        // 2回目：★を5個
        output = "★★★★★";
        break;
      case 3:
        // 3回目：1～5の数字を1行で
        output = "1 2 3 4 5";
        break;
      case 4:
        // 4回目：偶数のみ
        output = "2 4 6 8 10";
        break;
      case 5:
        // 5回目：1～5までの合計
        output = "1+2+3+4+5=15";
        break;
      default:
        // 6回目以降：リセット
        output = "クリアしました。カウントを0に戻します。";
        count = 0;
        break;
    }

    countEl.textContent = count;
    resultEl.textContent = output;
  });
</script>
</body>
</html>
